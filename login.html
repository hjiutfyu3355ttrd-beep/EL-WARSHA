<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#e67e22" />
    <title>تسجيل الدخول — نظام الورشة</title>
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="login-wrap">
      <section class="login-hero">
        <img src="assets/img/logo.svg" alt="" />
        <h1>الورشة</h1>
        <p>نظام إدارة الورش — أوامر الشغل والعملاء والمخزون في مكان واحد</p>
      </section>
      <section class="login-side">
        <div class="login-card">
          <h2>تسجيل الدخول</h2>
          <p class="sub">أدخل رقم تليفونك وكلمة المرور</p>
          <form id="form">
            <div class="field"><label for="phone">رقم التليفون</label>
              <input id="phone" type="tel" inputmode="tel" placeholder="01XXXXXXXXX" required dir="ltr" autocomplete="tel" /></div>
            <div class="field"><label for="password">كلمة المرور</label>
              <input id="password" type="password" placeholder="••••••••" required dir="ltr" autocomplete="current-password" /></div>
            <div class="error" id="msg"></div>
            <button id="btn">تسجيل الدخول</button>
          </form>
          <p style="margin-bottom: 0">ماعندكش حساب؟ <a class="link" href="signup.html">سجّل ورشتك</a></p>
        </div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="js/config.js"></script>
    <script src="js/db.js"></script>
    <script src="js/pages/login.js"></script>
  </body>
</html>
