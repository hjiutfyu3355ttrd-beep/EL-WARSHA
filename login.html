<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0F766E" />
    <title>تسجيل الدخول — نظام الورشة</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="login-wrap">
      <div class="card login-card">
        <h2 style="margin-top: 0">🔧 دخول نظام الورشة</h2>
        <form id="form">
          <input id="email" type="email" placeholder="البريد الإلكتروني" required dir="ltr" autocomplete="email" />
          <input id="password" type="password" placeholder="كلمة المرور" required dir="ltr" autocomplete="current-password" />
          <div class="error" id="msg"></div>
          <button id="btn">دخول</button>
        </form>
        <p style="margin-bottom: 0">ماعندكش حساب؟ <a class="link" href="signup.html">سجّل ورشتك</a></p>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="js/config.js"></script>
    <script src="js/db.js"></script>
    <script src="js/pages/login.js"></script>
  </body>
</html>
