<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0F766E" />
    <title>سجّل ورشتك — نظام الورشة</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="login-wrap">
      <div class="card login-card">
        <div class="field" style="margin-bottom:12px">
          <label id="login-lang-label">اللغة</label>
          <select id="login-lang">
            <option value="ar">العربية</option>
            <option value="tr">Türkçe</option>
          </select>
        </div>
        <h2 id="signup-title" style="margin-top: 0">سجّل ورشتك</h2>

        <form id="form">
          <input id="shop" placeholder="اسم الورشة" required />
          <input id="email" type="email" placeholder="البريد الإلكتروني" required dir="ltr" autocomplete="email" />
          <input id="password" type="password" placeholder="كلمة المرور (6 أحرف على الأقل)" required minlength="6" dir="ltr" autocomplete="new-password" />
          <div class="error" id="msg"></div>
          <button id="btn">إنشاء الحساب</button>
        </form>

        <div id="info" style="display: none">
          <div class="notice" id="signup-confirm"></div>
          <a class="link" href="login.html" id="signup-go-login"></a>
        </div>

        <p id="signup-footer" style="margin-bottom: 0"></p>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="js/config.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/db.js"></script>
    <script src="js/pages/signup.js"></script>
  </body>
</html>
