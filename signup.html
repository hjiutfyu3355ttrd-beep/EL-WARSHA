<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#080B10" />
    <title>سجّل ورشتك — نظام الورشة</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg" />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body>
    <div class="login-wrap">
      <section class="login-hero">
        <img src="assets/img/logo.png" alt="" />
        <h1>EL <em>WARSHA</em></h1>
        <p>نظام إدارة الورش — أوامر الشغل والعملاء والمخزون في مكان واحد</p>
      </section>
      <section class="login-side">
        <div class="login-card">
          <h2>سجّل ورشتك</h2>
          <p class="sub">ابدأ تجربتك المجانية في دقيقة</p>
          <form id="form">
            <div class="field"><label for="shop">اسم الورشة</label>
              <input id="shop" placeholder="مثال: ورشة النور" required /></div>
            <div class="field"><label for="phone">رقم التليفون</label>
              <input id="phone" type="tel" inputmode="tel" placeholder="01XXXXXXXXX" required dir="ltr" autocomplete="tel" /></div>
            <div class="field"><label for="password">كلمة المرور</label>
              <input id="password" type="password" placeholder="6 أحرف على الأقل" required minlength="6" dir="ltr" autocomplete="new-password" /></div>
            <div class="error" id="msg"></div>
            <button id="btn">إنشاء الحساب</button>
          </form>
          <div id="info" style="display: none">
            <div class="notice">تم إنشاء الحساب. سجّل دخولك برقم التليفون.</div>
            <a class="link" href="login.html">الذهاب لتسجيل الدخول</a>
          </div>
          <p style="margin-bottom: 0">عندك حساب؟ <a class="link" href="login.html">دخول</a></p>
        </div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
    <script src="js/config.js"></script>
    <script src="js/db.js"></script>
    <script src="js/pages/signup.js"></script>
  </body>
</html>
